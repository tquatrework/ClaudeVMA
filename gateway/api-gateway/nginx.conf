      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- email availability check during registration (no auth_request)
    location = /api/v1/accounts/check-email {
      limit_req zone=auth burst=10 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://identity_access/accounts/check-email;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Protected -- account management
    location ^~ /api/v1/accounts/ {
      auth_request /internal/auth;
      proxy_pass http://identity_access/accounts/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
