# Configuration nginx du frontend React (servi par l'image `frontend`).
#
# Deux regles de cache, et une seule raison : l'utilisateur doit voir la version
# qu'on vient de deployer, jamais celle d'hier.
#
#   /assets/*   -> noms haches par Vite (index-j26QbPD9.js). Un contenu different
#                  produit un nom different, donc le fichier peut etre garde un an
#                  sans revalidation. `immutable` evite meme le 304.
#   tout le reste (dont index.html) -> `no-cache`. Attention au sens : `no-cache`
#                  n'interdit pas la mise en cache, il impose de REVALIDER avant
#                  reutilisation. Avec l'ETag deja emis par nginx, une page
#                  inchangee coute un 304 vide. Surtout pas `no-store`, qui
#                  forcerait un retelechargement complet a chaque navigation.
#
# Sans cela, le navigateur applique son heuristique : il garde un vieil
# index.html, qui reference l'ancien bundle PAR SON NOM HACHE, lui-meme en cache.
# L'utilisateur regarde alors une version perimee en croyant voir la derniere,
# et toute validation visuelle devient sujette a caution.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Actifs generes par Vite, au nom porteur d'un hash du contenu.
    # `try_files ... =404` et non un repli sur index.html : un bundle manquant
    # doit se voir en 404, pas etre servi comme du HTML que le navigateur
    # tenterait d'executer en JavaScript.
    # Pas de `always` ici, contrairement au bloc suivant : l'en-tete ne doit
    # porter que sur les reponses servies. Un `404` annonce « immutable, un an »
    # ferait garder une absence en cache aussi longtemps que le fichier lui-meme.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Repli SPA : toutes les routes React (/rp/teacher-validations, /profile...)
    # sont servies par index.html. Le try_files provoque une redirection interne
    # vers /index.html, qui repasse par ce meme bloc `location /` : l'en-tete
    # ci-dessous s'applique donc aussi bien a `/` qu'aux routes profondes.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
