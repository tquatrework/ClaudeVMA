    # ================================================================
    # orchestration-service  (port 3000)
    # Each controller path is routed explicitly.
    # ================================================================

    # Top-level /api/v1/orchestration catch-all (protected)
    location ^~ /api/v1/orchestration/ {
      auth_request /internal/auth;
      proxy_pass http://orchestration/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # /api/v1/workflows -> orchestration-service (canonical prefix per target mapping)
    location ^~ /api/v1/workflows {
      auth_request /internal/auth;
      proxy_pass http://orchestration/workflows;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Webhooks externes : pas d'auth JWT utilisateur.
    # Protection assurée côté service par X-Webhook-Secret (WEBHOOK_SECRET).
    location ^~ /api/v1/orchestration/callbacks {
      proxy_pass http://orchestration/callbacks;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/orchestration/docs {
      proxy_pass http://orchestration/api/docs;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # -- JSON error pages ------------------------------------------
    error_page 401 = @unauthorized;
    location @unauthorized {
      add_header Content-Type application/json always;
      return 401 '{"statusCode":401,"message":"Unauthorized"}';
    }

    error_page 403 = @forbidden;
    location @forbidden {
      add_header Content-Type application/json always;
      return 403 '{"statusCode":403,"message":"Forbidden"}';
    }

    error_page 502 503 504 = @unavailable;
    location @unavailable {
      add_header Content-Type application/json always;
      return 502 '{"statusCode":502,"message":"Service temporarily unavailable"}';
    }
  }
