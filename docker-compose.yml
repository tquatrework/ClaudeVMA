version: '3.9'

services:
  # -- Infrastructure ----------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: visiomath_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiomath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiomath_secret}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - visiomath_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiomath}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visiomath_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - visiomath_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # LiveKit (auto-hebergement, chantier calendrier-visio-livekit, point 4,
  # 2026-08-19). Un seul conteneur, en dehors de nginx-global (hors depot, non
  # modifiable) et en dehors meme du reverse proxy applicatif visiomath_gateway :
  # le SDK client LiveKit se connecte en direct au serveur LiveKit (WebRTC), un
  # simple reverse proxy HTTP ne suffit pas pour le media RTC. Expose donc des
  # ports host dedies. Conteneur temporaire sur cette machine : en cas de
  # montee en charge il sera deporte ailleurs, d'ou LIVEKIT_API_URL /
  # LIVEKIT_PUBLIC_URL entierement pilotes par configuration cote
  # video-session-service, jamais par un nom de service docker-compose code en
  # dur dans le code applicatif.
  #
  # TLS (suite du 2026-08-19, meme session) : le port 7880 (signalisation
  # HTTP/WebSocket) n'est PLUS publie directement sur l'hote. Un navigateur
  # ouvert depuis https://claudevma.visioprof.fr refuse une connexion
  # WebSocket non chiffree (ws://) — contenu mixte bloque en silence.
  # livekit-server ne sait terminer du TLS que pour son relais TURN
  # (--turn-cert/--turn-key), jamais pour ce port principal (verifie contre
  # l'image reelle 1.13.5, `help-verbose` ne liste tls_cert_file/tls_key_file
  # que sous turn.*) : la terminaison TLS est donc deleguee au service
  # livekit-tls ci-dessous, qui est desormais le seul a publier le port 7880
  # sur l'hote. 7881 (repli TCP) et la plage UDP media restent publies ici
  # directement : ce sont des flux WebRTC/ICE, deja chiffres au niveau media
  # (SRTP), pas des connexions WebSocket soumises au blocage "contenu mixte".
  livekit:
    image: livekit/livekit-server:latest
    container_name: visiomath_livekit
    command:
      # LIVEKIT_API_KEY / LIVEKIT_API_SECRET doivent etre IDENTIQUES ici et cote
      # video-session-service plus bas (le serveur signe/verifie avec la meme
      # paire) — verifie reellement le 2026-08-19 contre une vraie instance
      # LiveKit 1.13.5 : le secret DOIT faire au moins 32 caracteres, sous
      # peine d'un rejet (`secret is too short`, HTTP 401 "invalid token,
      # signature is invalid" cote client). Le defaut ci-dessous en fait 34,
      # mais reste un defaut de developpement a changer en production comme
      # JWT_SECRET/INTERNAL_SECRET.
      - --keys
      - "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-change_me_in_production_min32chars}"
      - --node-ip
      - "${LIVEKIT_NODE_IP:?LIVEKIT_NODE_IP doit être défini : IP publique de cette machine, utilisée par LiveKit pour ses candidats ICE}"
      - --udp-port
      - "50000-50019"
    ports:
      # 7880 n'est plus publie ici (voir commentaire ci-dessus) : livekit-tls
      # le fait en son nom, apres terminaison TLS. Le conteneur continue
      # d'ecouter 7880 en clair sur le reseau Docker interne, atteint par
      # livekit-tls via le nom de service "livekit".
      #
      # Repli RTC en TCP quand l'UDP est bloque par le reseau du client.
      - "7881:7881"
      # Media RTC. Plage UDP dediee et etroite (20 ports) plutot que la plage
      # tres large par defaut de LiveKit (50000-60000) : a documenter et a
      # ouvrir explicitement sur le pare-feu de la machine.
      - "50000-50019:50000-50019/udp"
    networks:
      - visiomath_network
    restart: unless-stopped

  # Terminaison TLS dediee a LiveKit, et seulement a LiveKit — chantier
  # calendrier-visio-livekit, point 4 suite (2026-08-19). Nouveau conteneur
  # strictement dedie, ne touche ni nginx-global (hors depot) ni
  # visiomath_gateway (le SDK client LiveKit se connecte en direct, jamais via
  # l'API HTTP classique) : coherent avec le choix deja fait d'un port dedie
  # et d'une exposition directe.
  #
  # Certificat AUTO-SIGNE DE TEST (infra/livekit-tls/certs/, voir le README de
  # ce dossier pour la justification complete) — decision utilisateur du
  # 2026-08-19, assumee pour une phase de test rapide. Consequence pour
  # l'utilisateur : ouvrir une fois https://<IP>:7880/ dans le navigateur et
  # accepter manuellement l'avertissement de securite AVANT de rejoindre une
  # visio depuis l'application — sinon la connexion WebSocket echoue en
  # silence cote client alors que tout fonctionne cote serveur. Documente en
  # detail dans le rapport de session et docs/services/video-session-service.md.
  livekit-tls:
    image: caddy:2-alpine
    container_name: visiomath_livekit_tls
    volumes:
      - ./infra/livekit-tls/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/livekit-tls/certs:/certs:ro
    ports:
      - "7880:7880"
    depends_on:
      - livekit
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- Frontend -----------------------------------------------------------------

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: visiomath_frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- API Gateway -------------------------------------------------------------

  api-gateway:
    build:
      context: ./gateway/api-gateway
      dockerfile: Dockerfile
    container_name: visiomath_gateway
    ports:
      - "8098:80"
    depends_on:
      - identity-access-service
      - profile-service
      - dashboard-notification-service
      - communication-service
      - calendar-service
      - teacher-request-service
      - video-session-service
      - pedagogical-log-service
      - admin-observability-service
      - archive-document-service
      - legal-document-service
      - finance-credit-service
      - content-catalog-service
      - learning-activity-service
      - community-path-service
      - orchestration-service
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- Phase 1 Services ---------------------------------------------------------

  orchestration-service:
    build:
      context: ./services/orchestration-service
      dockerfile: Dockerfile
    container_name: visiomath_orchestration
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-visiomath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-visiomath_secret}
      DB_NAME: visiomath_orchestration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  identity-access-service:
    build:
      context: ./services/identity-access-service
      dockerfile: Dockerfile
    container_name: visiomath_identity_access
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_identity_access
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  profile-service:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: visiomath_profile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_profile
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3002
      # Medias attaches aux champs de profil (photo de profil).
      # Volume nomme : sans lui, les fichiers vivent dans la couche ephemere
      # du conteneur et disparaissent au premier `up --build`.
      MEDIA_STORAGE_PATH: /app/storage/media
      # 1 Mo au sens SI (1 000 000 octets), et non 1 Mio.
      # En amont, `nginx-global` ne declare pas de `client_max_body_size` : son
      # defaut est 1 Mio (1 048 576 octets), applique au corps entier, entetes
      # multipart comprises. Plafonner l'application juste en dessous garantit
      # que le refus vienne d'ici, avec un message francais lisible, et jamais
      # d'un 413 nginx muet. Relever cette valeur sans relever nginx d'abord ne
      # deplacerait le refus que hors de portee du code.
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-1000000}
    volumes:
      - media_data:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  dashboard-notification-service:
    build:
      context: ./services/dashboard-notification-service
      dockerfile: Dockerfile
    container_name: visiomath_dashboard_notification
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_dashboard_notification
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      # Necessaire au consommateur du flux Redis visiomath:events pour
      # resoudre les noms (jamais d'UUID affiche) et les parents financeurs
      # d'un eleve (arbitrage du 2026-08-14, "Systeme de notifications
      # transversal"). profile-service reste l'unique proprietaire de ces
      # donnees ; ce service ne fait que les lui demander.
      PROFILE_SERVICE_URL: http://profile-service:3002
      # Necessaire au vrai fan-out des notifications par role (correctif
      # 2026-08-17) : identity-access-service reste l'unique proprietaire du
      # role (docs/architecture.md > "Propriete du role"), ce service lui
      # demande GET /internal/accounts?role=... pour resoudre les userId
      # reels au lieu d'une ligne fictive userId="role:<role>".
      IDENTITY_ACCESS_SERVICE_URL: http://identity-access-service:3001
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  communication-service:
    build:
      context: ./services/communication-service
      dockerfile: Dockerfile
    container_name: visiomath_communication
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_communication
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  calendar-service:
    build:
      context: ./services/calendar-service
      dockerfile: Dockerfile
    container_name: visiomath_calendar
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_calendar
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      # Chantier calendrier de disponibilites, point 2 (visibilite busy/free
      # pilotee par relation metier). profile-service reste l'unique
      # proprietaire des relations (arbitrages des 2026-08-11/12). Declaree
      # explicitement, jamais laissee au defaut code en dur du client — meme
      # port que partout ailleurs dans ce fichier.
      PROFILE_SERVICE_URL: http://profile-service:3002
      # Correctif CAL-FB-004 (2026-08-18) : GET /calendars/:ownerId/busy
      # resout desormais le role du titulaire auprès d'identity-access-service
      # (unique proprietaire du role), au lieu de la ligne Calendar dont
      # l'existence n'est pas garantie. Meme port que partout ailleurs dans
      # ce fichier.
      IDENTITY_ACCESS_SERVICE_URL: http://identity-access-service:3001
      # Chantier calendrier de disponibilites, point 3 (2026-08-18) : flux
      # Redis "visiomath:events" (meme flux que teacher-request-service),
      # necessaire a EventPublisher pour remettre les evenements de
      # domain_events (ex. ActivityScheduled) a dashboard-notification-service.
      # Optionnelle cote code (voir env.validation.ts) mais declaree ici comme
      # partout ailleurs dans ce fichier.
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      PORT: 3005
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  teacher-request-service:
    build:
      context: ./services/teacher-request-service
      dockerfile: Dockerfile
    container_name: visiomath_teacher_request
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_teacher_request
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3006
      # Sans cette variable, le client retombait sur un defaut code en dur
      # (`http://profile-service:3000`) alors que profile-service ecoute sur
      # 3002 : le lien parent↔eleve n'etait jamais verifie et le RP ne lisait
      # que des UUID. profile-service reste l'unique proprietaire des relations
      # (arbitrages des 2026-08-11 et 2026-08-12).
      PROFILE_SERVICE_URL: http://profile-service:3002
      # Bus des evenements metier. Sans lui, les evenements restent dans la
      # table `domain_events` et ne sont pas perdus, mais aucun abonne ne les
      # recoit.
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  video-session-service:
    build:
      context: ./services/video-session-service
      dockerfile: Dockerfile
    container_name: visiomath_video_session
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_video_session
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      # Flux Redis "visiomath:events" (meme flux que calendar-service et
      # teacher-request-service, arbitrage 2026-08-14 "generique pour les
      # autres flux") : necessaire pour consommer ActivityScheduled /
      # ActivityConfirmed et creer automatiquement une salle LiveKit a
      # l'acceptation d'un creneau de cours (chantier calendrier-visio-livekit,
      # point 4). Sans elle, la creation automatique de salle est desactivee
      # (repli explicite, voir EventsConsumerService.onModuleInit) mais la
      # creation manuelle de salle (POST /video/rooms) continue de fonctionner.
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      # Appel serveur-a-serveur (RoomServiceClient, AccessToken) vers LiveKit.
      # Interne au reseau Docker : jamais la meme URL que celle donnee au
      # navigateur (LIVEKIT_PUBLIC_URL ci-dessous) — voir docs/routes.md,
      # section video-session-service.
      LIVEKIT_API_URL: http://livekit:7880
      # Cles API LiveKit. Valeurs par defaut UNIQUEMENT pour le developpement,
      # au meme titre que JWT_SECRET/INTERNAL_SECRET plus haut : a changer en
      # production (voir le rapport de session pour le detail).
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-change_me_in_production_min32chars}
      # URL que le SDK LiveKit cote navigateur joint EN DIRECT, jamais via
      # visiomath_gateway (le SDK client ne parle pas HTTP REST classique).
      # Aucun defaut sur : c'est une adresse reseau reelle (IP publique ou nom
      # de domaine de cette machine, port 7880), un mauvais defaut casserait
      # silencieusement la visio cote client. Voir LIVEKIT_NODE_IP ci-dessus.
      #
      # DOIT etre en wss:// depuis le 2026-08-19 (suite TLS) : le front est
      # servi en HTTPS (https://claudevma.visioprof.fr), un navigateur refuse
      # une connexion WebSocket non chiffree (ws://) depuis une page HTTPS
      # (contenu mixte, bloque en silence). La terminaison TLS est assuree par
      # le service livekit-tls ci-dessus, qui publie desormais seul le port
      # 7880 sur l'hote. Valeur attendue pour cette machine :
      # wss://193.108.54.226:7880 — certificat AUTO-SIGNE DE TEST, voir
      # infra/livekit-tls/certs/README.md : l'utilisateur doit ouvrir une fois
      # https://193.108.54.226:7880/ dans son navigateur et accepter
      # l'avertissement de securite AVANT de rejoindre une visio, sinon la
      # connexion WebSocket echoue en silence cote client.
      LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:?LIVEKIT_PUBLIC_URL doit etre defini, URL wss:// (obligatoire depuis un front HTTPS) que le navigateur du client joint directement pour LiveKit}"
      # Resolution du prenom/nom de l'appelant avant de generer le token LiveKit
      # (correctif 2026-08-19 : l'identite LiveKit brute, un UUID, s'affichait sur
      # les tuiles de participants faute de `name`). Best-effort : si
      # profile-service est injoignable, le join n'est jamais bloque, seul `name`
      # est omis du token (voir ProfileClientService et docs/routes.md).
      PROFILE_SERVICE_URL: http://profile-service:3002
      PORT: 3007
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      livekit-tls:
        condition: service_started
      profile-service:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  pedagogical-log-service:
    build:
      context: ./services/pedagogical-log-service
      dockerfile: Dockerfile
    container_name: visiomath_pedagogical_log
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_pedagogical_log
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      # Flux Redis "visiomath:events" (meme flux que calendar-service,
      # teacher-request-service et video-session-service, arbitrage 2026-08-14
      # "generique pour les autres flux") : necessaire pour consommer
      # ActivityScheduled / ActivityConfirmed et creer automatiquement une
      # entree de cahier de texte a la confirmation d'une activite "cours"
      # (chantier refonte-cahier-de-texte, point 5). Sans elle, la creation
      # automatique reste desactivee (repli explicite, meme pattern que
      # video-session-service).
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      # Necessaire pour verifier, a chaque ecriture, que l'appelant est bien
      # le formateur titulaire de la relation avec l'eleve (ecriture reservee
      # au formateur, point 3 du chantier) ; profile-service reste l'unique
      # proprietaire des relations, ce service ne fait que les lui demander.
      PROFILE_SERVICE_URL: http://profile-service:3002
      # Necessaire au rappel quotidien (point 5) : notifie le formateur via
      # POST /internal/notify quand une entree auto-creee reste vide plus de
      # 24h apres la fin de l'activite liee.
      DASHBOARD_NOTIFICATION_SERVICE_URL: http://dashboard-notification-service:3003
      PORT: 3008
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- Phase 2 Services ---------------------------------------------------------

  admin-observability-service:
    build:
      context: ./services/admin-observability-service
      dockerfile: Dockerfile
    container_name: visiomath_admin_observability
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_admin_observability
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3009
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  archive-document-service:
    build:
      context: ./services/archive-document-service
      dockerfile: Dockerfile
    container_name: visiomath_archive_document
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_archive_document
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3010
      # Le droit de lire une archive pedagogique vient de la RELATION metier
      # (arbitrage du 2026-08-11). profile-service en reste l'unique
      # proprietaire : ce service la lui demande a chaque decision
      # (GET /internal/relations/:viewerId/:targetId) et n'en tient aucune copie.
      PROFILE_SERVICE_URL: http://profile-service:3002
    depends_on:
      postgres:
        condition: service_healthy
      profile-service:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  legal-document-service:
    build:
      context: ./services/legal-document-service
      dockerfile: Dockerfile
    container_name: visiomath_legal_document
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_legal_document
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3011
    depends_on:
