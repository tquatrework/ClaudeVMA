worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # -- Logging -----------------------------------------------------
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr corr=$http_x_correlation_id';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # -- Rate limiting ------------------------------------------------
  # auth: 10 req/min -- brute-force protection on login/refresh
  # api:  30 req/s  -- general API ceiling with short burst headroom
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # ==================================================================
  # Resolution DNS des services -- corrige a la racine les 502 apres
  # redeploiement d'un service.
  # ==================================================================
  #
  # Defaut mesure le 2026-08-11 : reconstruire un conteneur lui donne une
  # nouvelle adresse IP sur le reseau Docker. Avec un bloc `upstream { server
  # profile-service:3002; }`, nginx resout le nom UNE FOIS au chargement de la
  # configuration et garde l'adresse pour toujours. Il continuait donc a
  # appeler l'ancienne : 20 reponses 502 entre 14:31 et 14:43 sur toutes les
  # routes de profile-service, alors que depuis le conteneur gateway
  # `wget http://profile-service:3002/health` repondait 200. Le contournement
  # etait un `nginx -s reload` manuel, a refaire a chaque redeploiement de
  # chacun des seize services.
  #
  # Correction en deux temps, les deux sont necessaires :
  #
  #   1. `resolver` -- designe le DNS interne de Docker (127.0.0.11) avec une
  #      duree de validite courte. `ipv6=off` parce que le DNS Docker repond
  #      aussi en AAAA et que nginx tenterait alors une connexion IPv6 vers un
  #      reseau qui n'en fait pas.
  #   2. La cible du `proxy_pass` portee par une VARIABLE (`$upstream_*`,
  #      declarees plus bas). Sans variable, nginx resout au demarrage et met
  #      le resultat en cache definitivement, `resolver` ou pas : c'est le
  #      point qui fait reellement la difference.
  #
  # Effet de bord bienvenu : les blocs `upstream` obligeaient nginx a resoudre
  # les seize noms au demarrage, et la gateway refusait de demarrer avec un
  # `host not found in upstream` si un seul service etait absent. Ce n'est
  # plus le cas ; un service absent donne un 502 JSON sur ses seules routes.
  # `valid=5s` : nginx conserve une reponse DNS au moins le temps declare. La
  # correction supprime la peremption DEFINITIVE, pas la fenetre de quelques
  # secondes qui suit un changement d'adresse -- fenetre pendant laquelle le
  # service redemarre de toute facon. Mesure du 2026-08-11 avec `valid=10s` :
  # un seul 502 a 15:18:40, suivi d'un 200 dans la meme seconde. Ramene a 5s
  # pour reduire ce reliquat ; le DNS de Docker est local, une resolution
  # supplementaire ne coute rien.
  resolver         127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;

  # ==================================================================
  # Reecriture d'URI -- le piege des variables dans proxy_pass
  # ==================================================================
  #
  # Des qu'un `proxy_pass` contient une variable, nginx CESSE de substituer
  # automatiquement le prefixe du `location` par l'URI du `proxy_pass`. Une
  # conversion naive aurait donc transmis `/api/v1/profiles/...` au service au
  # lieu de `/profiles/...`, et repondu 404 sur toutes les routes -- un defaut
  # permanent en echange d'un 502 occasionnel.
  #
  # L'URI transmise est donc reconstruite explicitement, par des `map` qui ne
  # font que retirer un prefixe constant. Trois precautions :
  #
  #   - on part de `$request_uri` (brut, chaine de requete comprise) et non de
  #     `$uri` (normalise et decode) : `$uri` re-injecterait des caracteres
  #     decodes dans l'URL amont, cassant `a%20b` ou `q=a%2Bb` ;
  #   - la chaine de requete etant deja dans `$request_uri`, aucune location
  #     n'ajoute `$is_args$args` -- ce serait un doublon ;
  #   - ce sont des `map`, pas des `rewrite` ni des `location ~` : la gateway
  #     ne reinterprete toujours aucun segment d'URL, elle retire un prefixe
  #     litteral, exactement ce que nginx faisait tout seul.
  #
  # Non-regression mesuree le 2026-08-11 : 88 chemins, un par prefixe de
  # `location` plus les cas encodes et les chaines de requete, rejoues contre
  # l'ancienne puis la nouvelle configuration avec un echo en aval renvoyant
  # l'URI recue. Diff vide, a un seul ecart pres, volontaire et documente ici :
  # un double slash (`/api/v1/profiles//double`) etait auparavant fusionne
  # (`/profiles/double`, effet de `merge_slashes` sur `$uri`) et est desormais
  # transmis tel quel (`/profiles//double`). C'est le prix de `$request_uri`,
  # et c'est le bon sens de l'echange : preserver l'encodage est indispensable,
  # fusionner des slashes que personne n'envoie ne l'est pas. Ce comportement
  # est d'ailleurs plus conforme a la regle « la gateway ne reinterprete jamais
  # un segment d'URL ».

  # Cas general : /api/v1/<reste> -> /<reste>. Couvre la quasi-totalite des
  # locations, dont le prefixe cible est le prefixe gateway prive de /api/v1.
  map $request_uri $api_v1_suffix {
    ~^/api/v1(?<apiV1Rest>/.*)$  $apiV1Rest;
    default                      $request_uri;
  }

  # Swagger : /api/v1/<service>/docs[...] -> /api/docs[...]. Consomme
  # UNIQUEMENT par les locations `.../docs`, jamais globalement : un chemin
  # comme /api/v1/students/docs doit continuer d'aller a pedagogical-log-service
  # tel quel, et non d'etre detourne vers /api/docs.
  # Le reste est capture par `.*` et non par `[/?].*` : c'est ce qui reproduit
  # a l'identique la substitution de prefixe de nginx, qui coupait sur le
  # prefixe du `location` sans exiger une frontiere de segment. Verifie sur
  # /api/v1/profiles/docsomething, transmis `/api/docsomething` avant comme
  # apres -- avec une capture par segment, il aurait servi le Swagger.
  map $request_uri $docs_suffix {
    ~^/api/v1/[^/]+/docs(?<docsRest>.*)$  $docsRest;
    default                               "";
  }

  # teacher-request-service : le prefixe public /api/v1/teacher-requests ne
  # porte pas le nom du controleur, qui est /requests.
  map $request_uri $teacher_requests_suffix {
    ~^/api/v1/teacher-requests(?<teacherRequestsRest>.*)$  $teacherRequestsRest;
    default                                                "";
  }

  # finance-credit-service : /api/v1/finance/<reste> -> /<reste> (racine du
  # service, les controleurs sont /financial-profiles, /credits, ...).
  map $request_uri $finance_suffix {
    ~^/api/v1/finance(?<financeRest>/.*)$  $financeRest;
    default                                /;
  }

  # orchestration-service : /api/v1/orchestration/<reste> -> /<reste>.
  map $request_uri $orchestration_suffix {
    ~^/api/v1/orchestration(?<orchestrationRest>/.*)$  $orchestrationRest;
    default                                            /;
  }

  server {
    listen 80;
    server_name _;

    # -- Cibles amont -------------------------------------------------
    # Chaque valeur est le nom de service Docker et le port interne du
    # conteneur. Portees par des variables, elles sont re-resolues a chaque
    # requete via le `resolver` declare plus haut : un conteneur reconstruit
    # est joint sur sa nouvelle adresse sans recharger la gateway.
    set $upstream_identity_access     "identity-access-service:3001";
    set $upstream_profile             "profile-service:3002";
    set $upstream_dashboard           "dashboard-notification-service:3003";
    set $upstream_communication       "communication-service:3004";
    set $upstream_calendar            "calendar-service:3005";
    set $upstream_teacher_request     "teacher-request-service:3006";
    set $upstream_video_session       "video-session-service:3007";
    set $upstream_pedagogical_log     "pedagogical-log-service:3008";
    set $upstream_admin_observability "admin-observability-service:3009";
    set $upstream_archive_document    "archive-document-service:3010";
    set $upstream_legal_document      "legal-document-service:3011";
    set $upstream_finance_credit      "finance-credit-service:3012";
    set $upstream_content_catalog     "content-catalog-service:3013";
    set $upstream_learning_activity   "learning-activity-service:3014";
    set $upstream_community_path      "community-path-service:3015";
    set $upstream_orchestration       "orchestration-service:3000";

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # -- Taille maximale du corps des requetes -----------------------
    # Declaree explicitement : sans cette directive, nginx applique son defaut
    # de 1 Mio (1 048 576 octets) et la gateway devient un plafond cache, en
    # plus de `nginx-global` en amont et du plafond applicatif en aval.
    # Verifie le 2026-08-10 contre la pile reelle, en attaquant la gateway
    # directement (donc hors `nginx-global`) : un envoi multipart de 1 048 000
    # octets passait, 1 048 500 octets repartait en `413` HTML emis par nginx.
    # Le plafond qui doit s'appliquer est celui de l'application (multipart de
    # photo de profil : MEDIA_MAX_UPLOAD_BYTES, 1 000 000 octets), parce qu'il
    # est le seul a repondre un corps JSON exploitable par le front. La gateway
    # se place donc franchement au-dessus, a la meme valeur que celle prevue
    # pour `nginx-global` : elle ne doit jamais etre le maillon qui coupe.
    # Relever le plafond applicatif reste subordonne a `nginx-global`, qui est
    # hors de ce depot et applique encore son defaut de 1 Mio.
    client_max_body_size 10m;

    # -- Internal JWT validation subrequest -----------------------
    # Called by auth_request on every protected location.
    # Proxies the Authorization header to /auth/me; returns 200 or 401.
    location = /internal/auth {
      internal;
      proxy_pass              http://$upstream_identity_access/auth/me;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length    "";
      proxy_set_header        Host              $host;
      proxy_set_header        Authorization     $http_authorization;
      proxy_set_header        X-Real-IP         $remote_addr;
      proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $forwarded_proto;
      proxy_set_header        X-Correlation-ID  $http_x_correlation_id;
    }

    # -- Gateway health --------------------------------------------
    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # -- Docs index -- links to each service Swagger UI -------------
    location = /docs {
      add_header Content-Type application/json;
      return 200 '{"services":["/api/v1/auth/docs","/api/v1/accounts/docs","/api/v1/profiles/docs","/api/v1/teacher-requests/docs","/api/v1/calendars/docs","/api/v1/video-sessions/docs","/api/v1/notebooks/docs","/api/v1/notifications/docs","/api/v1/messages/docs","/api/v1/audit/docs","/api/v1/archives/docs","/api/v1/legal-documents/docs","/api/v1/credits/docs","/api/v1/content/docs","/api/v1/learning/docs","/api/v1/forums/docs","/api/v1/orchestration/docs"]}';
    }

    # ================================================================
    # identity-access-service  (port 3001)
    # ================================================================

    # Public -- login, logout, refresh, password reset (no auth_request)
    location ^~ /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- account registration (POST only, no auth_request)
    location = /api/v1/accounts {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- student self-registration (POST only, no auth_request)
    location = /api/v1/accounts/students {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- teacher self-registration (POST only, no auth_request)
    location = /api/v1/accounts/teachers {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- parent self-registration (POST only, no auth_request)
    location = /api/v1/accounts/parents {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- email availability check during registration (no auth_request)
    location = /api/v1/accounts/check-email {
      limit_req zone=auth burst=10 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Protected -- account management
    location ^~ /api/v1/accounts/ {
      auth_request /internal/auth;
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Protected -- RGPD consents
    location ^~ /api/v1/consents {
      auth_request /internal/auth;
      proxy_pass http://$upstream_identity_access$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Swagger docs (public)
    location ^~ /api/v1/auth/docs {
      proxy_pass http://$upstream_identity_access/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ^~ /api/v1/accounts/docs {
      proxy_pass http://$upstream_identity_access/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # profile-service  (port 3002)
    # ================================================================

    location ^~ /api/v1/profiles {
      auth_request /internal/auth;
      proxy_pass http://$upstream_profile$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/relations {
      auth_request /internal/auth;
      proxy_pass http://$upstream_profile$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/parent-link-requests {
      auth_request /internal/auth;
      proxy_pass http://$upstream_profile$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/profiles/docs {
      proxy_pass http://$upstream_profile/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # dashboard-notification-service  (port 3003)
    # ================================================================

    location ^~ /api/v1/notifications {
      auth_request /internal/auth;
      proxy_pass http://$upstream_dashboard$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/dashboard {
      auth_request /internal/auth;
      proxy_pass http://$upstream_dashboard$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Keep legacy /dashboards prefix as alias
    location ^~ /api/v1/dashboards {
      auth_request /internal/auth;
      proxy_pass http://$upstream_dashboard$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/notifications/docs {
      proxy_pass http://$upstream_dashboard/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # communication-service  (port 3004, WebSocket capable)
    # ================================================================

    location ^~ /api/v1/messages {
      auth_request /internal/auth;
      proxy_pass http://$upstream_communication$api_v1_suffix;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/threads {
      auth_request /internal/auth;
      proxy_pass http://$upstream_communication$api_v1_suffix;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_read_timeout 3600s;
    }

    # Keep legacy /conversations prefix
    location ^~ /api/v1/conversations {
      auth_request /internal/auth;
      proxy_pass http://$upstream_communication$api_v1_suffix;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/incidents {
      auth_request /internal/auth;
      proxy_pass http://$upstream_communication$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/contacts {
      auth_request /internal/auth;
      proxy_pass http://$upstream_communication$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/messages/docs {
      proxy_pass http://$upstream_communication/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # calendar-service  (port 3005)
    # ================================================================

    location ^~ /api/v1/calendars {
      auth_request /internal/auth;
      proxy_pass http://$upstream_calendar$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
