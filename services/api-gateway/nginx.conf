worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Upstream services
  upstream identity_access_service   { server identity-access-service:3000; }
  upstream profile_service           { server profile-service:3000; }
  upstream teacher_request_service   { server teacher-request-service:3000; }
  upstream calendar_service          { server calendar-service:3000; }
  upstream video_session_service     { server video-session-service:3000; }
  upstream communication_service     { server communication-service:3000; }
  upstream pedagogical_log_service   { server pedagogical-log-service:3000; }
  upstream dashboard_notification    { server dashboard-notification-service:3000; }
  upstream orchestration_service     { server orchestration-service:3000; }

  server {
    listen 80;
    server_name _;

    # Gateway health check
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }

    # Swagger index — links to each service docs
    location = /docs {
      return 200 '{"services":["/api/v1/auth/docs","/api/v1/profiles/docs","/api/v1/requests/docs","/api/v1/calendar/docs","/api/v1/video/docs","/api/v1/messages/docs","/api/v1/logs/docs","/api/v1/notifications/docs","/api/v1/orchestration/docs"]}';
      add_header Content-Type application/json;
    }

    # ── Identity Access ──────────────────────────────────────
    location /api/v1/auth/ {
      proxy_pass         http://identity_access_service/auth/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth/docs {
      proxy_pass http://identity_access_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Profile ─────────────────────────────────────────────
    location /api/v1/profiles/ {
      proxy_pass         http://profile_service/profiles/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/profiles/docs {
      proxy_pass http://profile_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Teacher Request ─────────────────────────────────────
    location /api/v1/requests/ {
      proxy_pass         http://teacher_request_service/requests/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/requests/docs {
      proxy_pass http://teacher_request_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Calendar ────────────────────────────────────────────
    location /api/v1/calendar/ {
      proxy_pass         http://calendar_service/calendar/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/calendar/docs {
      proxy_pass http://calendar_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Video Session ───────────────────────────────────────
    location /api/v1/video/ {
      proxy_pass         http://video_session_service/video/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/video/docs {
      proxy_pass http://video_session_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Communication ───────────────────────────────────────
    location /api/v1/messages/ {
      proxy_pass         http://communication_service/messages/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/messages/docs {
      proxy_pass http://communication_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Pedagogical Log ─────────────────────────────────────
    location /api/v1/logs/ {
      proxy_pass         http://pedagogical_log_service/logs/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/logs/docs {
      proxy_pass http://pedagogical_log_service/api/docs;
      proxy_set_header Host $host;
    }

    # ── Dashboard Notification ──────────────────────────────
    location /api/v1/notifications/ {
      proxy_pass         http://dashboard_notification/notifications/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/notifications/docs {
      proxy_pass http://dashboard_notification/api/docs;
      proxy_set_header Host $host;
    }

    # ── Orchestration ────────────────────────────────────────
    location /api/v1/orchestration/ {
      proxy_pass         http://orchestration_service/orchestration/;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    location /api/v1/orchestration/docs {
      proxy_pass http://orchestration_service/api/docs;
      proxy_set_header Host $host;
    }
  }
}
