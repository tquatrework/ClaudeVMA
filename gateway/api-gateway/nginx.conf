worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Logging ─────────────────────────────────────────────────────
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ── Rate limiting ────────────────────────────────────────────────
  # auth: 10 req/min — brute-force protection on login/refresh
  # api:  30 req/s  — general API ceiling with short burst headroom
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

  # ── Upstreams ────────────────────────────────────────────────────
  upstream identity_access { server identity-access-service:3000; }
  upstream profile          { server profile-service:3000; }
  upstream teacher_request  { server teacher-request-service:3000; }
  upstream calendar         { server calendar-service:3000; }
  upstream video_session    { server video-session-service:3000; }
  upstream communication    { server communication-service:3000; }
  upstream pedagogical_log  { server pedagogical-log-service:3000; }
  upstream dashboard        { server dashboard-notification-service:3000; }
  upstream orchestration    { server orchestration-service:3000; }

  server {
    listen 80;
    server_name _;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # ── Internal JWT validation subrequest ───────────────────────
    # Called by auth_request on every protected location.
    # Proxies the Authorization header to /auth/me; returns 200 or 401.
    location = /internal/auth {
      internal;
      proxy_pass              http://identity_access/auth/me;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        Host          $host;
      proxy_set_header        Authorization $http_authorization;
    }

    # ── Gateway health ────────────────────────────────────────────
    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── Docs index — links to each service Swagger UI ─────────────
    location = /docs {
      add_header Content-Type application/json;
      return 200 '{"services":["/api/v1/auth/docs","/api/v1/accounts/docs","/api/v1/profiles/docs","/api/v1/relations/docs","/api/v1/requests/docs","/api/v1/calendar/docs","/api/v1/video/docs","/api/v1/messages/docs","/api/v1/logs/docs","/api/v1/notifications/docs","/api/v1/orchestration/docs"]}';
    }

    # ════════════════════════════════════════════════════════════════
    # identity-access-service
    # ════════════════════════════════════════════════════════════════

    # Public — login, logout, refresh (no auth_request)
    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://identity_access/auth/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    # Public — account registration (POST only, no auth_request)
    location = /api/v1/accounts {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://identity_access/accounts;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Protected — account management
    location /api/v1/accounts/ {
      auth_request /internal/auth;
      proxy_pass http://identity_access/accounts/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    # Protected — RGPD consents
    location /api/v1/consents/ {
      auth_request /internal/auth;
      proxy_pass http://identity_access/consents/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/auth/docs {
      proxy_pass http://identity_access/api/docs;
      proxy_set_header Host $host;
    }

    location /api/v1/accounts/docs {
      proxy_pass http://identity_access/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # profile-service
    # ════════════════════════════════════════════════════════════════

    location /api/v1/profiles/ {
      auth_request /internal/auth;
      proxy_pass http://profile/profiles/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/relations/ {
      auth_request /internal/auth;
      proxy_pass http://profile/relations/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/profiles/docs {
      proxy_pass http://profile/api/docs;
      proxy_set_header Host $host;
    }

    location /api/v1/relations/docs {
      proxy_pass http://profile/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # teacher-request-service
    # ════════════════════════════════════════════════════════════════

    location /api/v1/requests/ {
      auth_request /internal/auth;
      proxy_pass http://teacher_request/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/requests/docs {
      proxy_pass http://teacher_request/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # calendar-service
    # ════════════════════════════════════════════════════════════════

    location /api/v1/calendar/ {
      auth_request /internal/auth;
      proxy_pass http://calendar/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/calendar/docs {
      proxy_pass http://calendar/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # video-session-service  (WebSocket capable)
    # ════════════════════════════════════════════════════════════════

    location /api/v1/video/ {
      auth_request /internal/auth;
      proxy_pass http://video_session/video/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
      # WebSocket upgrade support
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api/v1/video/docs {
      proxy_pass http://video_session/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # communication-service  (WebSocket capable)
    # ════════════════════════════════════════════════════════════════

    location /api/v1/conversations/ {
      auth_request /internal/auth;
      proxy_pass http://communication/conversations/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api/v1/messages/ {
      auth_request /internal/auth;
      proxy_pass http://communication/messages/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
    }

    location /api/v1/incidents/ {
      auth_request /internal/auth;
      proxy_pass http://communication/incidents/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/messages/docs {
      proxy_pass http://communication/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # pedagogical-log-service
    # ════════════════════════════════════════════════════════════════

    location /api/v1/logs/ {
      auth_request /internal/auth;
      proxy_pass http://pedagogical_log/logs/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/memos/ {
      auth_request /internal/auth;
      proxy_pass http://pedagogical_log/memos/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/students/ {
      auth_request /internal/auth;
      proxy_pass http://pedagogical_log/students/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/logs/docs {
      proxy_pass http://pedagogical_log/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # dashboard-notification-service
    # ════════════════════════════════════════════════════════════════

    location /api/v1/notifications/ {
      auth_request /internal/auth;
      proxy_pass http://dashboard/notifications/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/dashboards/ {
      auth_request /internal/auth;
      proxy_pass http://dashboard/dashboards/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/notifications/docs {
      proxy_pass http://dashboard/api/docs;
      proxy_set_header Host $host;
    }

    # ════════════════════════════════════════════════════════════════
    # orchestration-service — each controller path is routed explicitly
    # ════════════════════════════════════════════════════════════════

    location /api/v1/orchestration/workflows/ {
      auth_request /internal/auth;
      proxy_pass http://orchestration/workflows/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/orchestration/commands/ {
      auth_request /internal/auth;
      proxy_pass http://orchestration/commands/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    location /api/v1/orchestration/events/ {
      auth_request /internal/auth;
      proxy_pass http://orchestration/events/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Authorization   $http_authorization;
    }

    # Webhooks externes : pas d'auth JWT utilisateur.
    # Protection assurée côté service par X-Webhook-Secret (WEBHOOK_SECRET).
    location /api/v1/orchestration/callbacks/ {
      proxy_pass http://orchestration/callbacks/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/orchestration/docs {
      proxy_pass http://orchestration/api/docs;
      proxy_set_header Host $host;
    }

    # ── JSON error pages ──────────────────────────────────────────
    error_page 401 = @unauthorized;
    location @unauthorized {
      add_header Content-Type application/json always;
      return 401 '{"statusCode":401,"message":"Unauthorized"}';
    }

    error_page 403 = @forbidden;
    location @forbidden {
      add_header Content-Type application/json always;
      return 403 '{"statusCode":403,"message":"Forbidden"}';
    }

    error_page 502 503 504 = @unavailable;
    location @unavailable {
      add_header Content-Type application/json always;
      return 502 '{"statusCode":502,"message":"Service temporarily unavailable"}';
    }
  }
}
