worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # -- Logging -----------------------------------------------------
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time upstream=$upstream_addr corr=$http_x_correlation_id';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # -- Rate limiting ------------------------------------------------
  # auth: 10 req/min -- brute-force protection on login/refresh
  # api:  30 req/s  -- general API ceiling with short burst headroom
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # -- Upstreams ----------------------------------------------------
  # Each server name is the Docker service name; port is the container-internal port.
  upstream identity_access    { server identity-access-service:3001; }
  upstream profile            { server profile-service:3002; }
  upstream dashboard          { server dashboard-notification-service:3003; }
  upstream communication      { server communication-service:3004; }
  upstream calendar           { server calendar-service:3005; }
  upstream teacher_request    { server teacher-request-service:3006; }
  upstream video_session      { server video-session-service:3007; }
  upstream pedagogical_log    { server pedagogical-log-service:3008; }
  upstream admin_observability { server admin-observability-service:3009; }
  upstream archive_document   { server archive-document-service:3010; }
  upstream legal_document     { server legal-document-service:3011; }
  upstream finance_credit     { server finance-credit-service:3012; }
  upstream content_catalog    { server content-catalog-service:3013; }
  upstream learning_activity  { server learning-activity-service:3014; }
  upstream community_path     { server community-path-service:3015; }
  upstream orchestration      { server orchestration-service:3000; }

  # -- Shared proxy headers snippet (reused via include is not available in bare nginx,
  #    so headers are repeated per location for clarity and correctness) ---------------

  server {
    listen 80;
    server_name _;

    proxy_connect_timeout 10s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # -- Internal JWT validation subrequest -----------------------
    # Called by auth_request on every protected location.
    # Proxies the Authorization header to /auth/me; returns 200 or 401.
    location = /internal/auth {
      internal;
      proxy_pass              http://identity_access/auth/me;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length    "";
      proxy_set_header        Host              $host;
      proxy_set_header        Authorization     $http_authorization;
      proxy_set_header        X-Real-IP         $remote_addr;
      proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $forwarded_proto;
      proxy_set_header        X-Correlation-ID  $http_x_correlation_id;
    }

    # -- Gateway health --------------------------------------------
    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # -- Docs index -- links to each service Swagger UI -------------
    location = /docs {
      add_header Content-Type application/json;
      return 200 '{"services":["/api/v1/auth/docs","/api/v1/accounts/docs","/api/v1/profiles/docs","/api/v1/teacher-requests/docs","/api/v1/calendars/docs","/api/v1/video-sessions/docs","/api/v1/notebooks/docs","/api/v1/notifications/docs","/api/v1/messages/docs","/api/v1/audit/docs","/api/v1/archives/docs","/api/v1/legal-documents/docs","/api/v1/credits/docs","/api/v1/content/docs","/api/v1/learning/docs","/api/v1/forums/docs","/api/v1/orchestration/docs"]}';
    }

    # ================================================================
    # identity-access-service  (port 3001)
    # ================================================================

    # Public -- login, logout, refresh, password reset (no auth_request)
    location ^~ /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://identity_access/auth/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- account registration (POST only, no auth_request)
    location = /api/v1/accounts {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://identity_access/accounts;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- student self-registration (POST only, no auth_request)
    location = /api/v1/accounts/students {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://identity_access/accounts/students;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Public -- teacher self-registration (POST only, no auth_request)
    location = /api/v1/accounts/teachers {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://identity_access/accounts/teachers;
      proxy_set_header Host              $host;
