version: '3.9'

services:
  # -- Infrastructure ----------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: visiomath_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visiomath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visiomath_secret}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - visiomath_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visiomath}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visiomath_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    networks:
      - visiomath_network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -- Frontend -----------------------------------------------------------------

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: visiomath_frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- API Gateway -------------------------------------------------------------

  api-gateway:
    build:
      context: ./gateway/api-gateway
      dockerfile: Dockerfile
    container_name: visiomath_gateway
    ports:
      - "8098:80"
    depends_on:
      - identity-access-service
      - profile-service
      - dashboard-notification-service
      - communication-service
      - calendar-service
      - teacher-request-service
      - video-session-service
      - pedagogical-log-service
      - admin-observability-service
      - archive-document-service
      - legal-document-service
      - finance-credit-service
      - content-catalog-service
      - learning-activity-service
      - community-path-service
      - orchestration-service
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- Phase 1 Services ---------------------------------------------------------

  orchestration-service:
    build:
      context: ./services/orchestration-service
      dockerfile: Dockerfile
    container_name: visiomath_orchestration
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-visiomath}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-visiomath_secret}
      DB_NAME: visiomath_orchestration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  identity-access-service:
    build:
      context: ./services/identity-access-service
      dockerfile: Dockerfile
    container_name: visiomath_identity_access
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_identity_access
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  profile-service:
    build:
      context: ./services/profile-service
      dockerfile: Dockerfile
    container_name: visiomath_profile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_profile
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3002
      # Medias attaches aux champs de profil (photo de profil).
      # Volume nomme : sans lui, les fichiers vivent dans la couche ephemere
      # du conteneur et disparaissent au premier `up --build`.
      MEDIA_STORAGE_PATH: /app/storage/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-8388608}
    volumes:
      - media_data:/app/storage/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  dashboard-notification-service:
    build:
      context: ./services/dashboard-notification-service
      dockerfile: Dockerfile
    container_name: visiomath_dashboard_notification
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_dashboard_notification
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  communication-service:
    build:
      context: ./services/communication-service
      dockerfile: Dockerfile
    container_name: visiomath_communication
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_communication
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  calendar-service:
    build:
      context: ./services/calendar-service
      dockerfile: Dockerfile
    container_name: visiomath_calendar
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_calendar
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: 3005
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  teacher-request-service:
    build:
      context: ./services/teacher-request-service
      dockerfile: Dockerfile
    container_name: visiomath_teacher_request
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_teacher_request
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: 3006
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  video-session-service:
    build:
      context: ./services/video-session-service
      dockerfile: Dockerfile
    container_name: visiomath_video_session
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_video_session
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
      PORT: 3007
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  pedagogical-log-service:
    build:
      context: ./services/pedagogical-log-service
      dockerfile: Dockerfile
    container_name: visiomath_pedagogical_log
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_pedagogical_log
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: 3008
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - visiomath_network
    restart: unless-stopped

  # -- Phase 2 Services ---------------------------------------------------------

  admin-observability-service:
    build:
      context: ./services/admin-observability-service
      dockerfile: Dockerfile
    container_name: visiomath_admin_observability
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-visiomath}:${POSTGRES_PASSWORD:-visiomath_secret}@postgres:5432/visiomath_admin_observability
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-change_me_in_production}
