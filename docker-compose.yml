volumes:
  postgres_data:
  redis_data:
  # Medias binaires de la plateforme. Monte aujourd'hui dans profile-service
  # seul, qui est le seul a lire et ecrire les octets ; les autres services
  # passent par sa route HTTP, jamais par le systeme de fichiers.
  # ATTENTION : non couvert par le dump Postgres, a ajouter a la sauvegarde.
  media_data:

networks:
  visiomath_network:
    driver: bridge
