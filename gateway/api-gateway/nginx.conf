      proxy_pass http://$upstream_learning_activity$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Activites non pourvues (OpenActivitiesController, @Controller('open-activities')) : gap du
    # meme type releve le 2026-09-01 en verifiant les autres prefixes de learning-activity-service
    # -- aucune location ne couvrait ce controleur non plus (404 nginx brut confirme sur la pile
    # reelle avant correction).
    location ^~ /api/v1/open-activities {
      auth_request /internal/auth;
      proxy_pass http://$upstream_learning_activity$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Tentatives d'Evaluation et corrections manuelles (arbitrage 2026-09-01, refonte des
    # Evaluations, module evaluation-attempts/ livre par la PR #196) : demarrage chronometre,
    # soumission, historique et demande de correction portes par learning-activity-service. Meme
    # gap et meme patron que /api/v1/exercise-attempts et /api/v1/open-activities ci-dessus --
    # aucune location ne couvrait ces deux nouveaux prefixes (404 nginx brut confirme sur la pile
    # reelle avant correction).
    location ^~ /api/v1/evaluation-attempts {
      auth_request /internal/auth;
      proxy_pass http://$upstream_learning_activity$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/evaluation-corrections {
      auth_request /internal/auth;
      proxy_pass http://$upstream_learning_activity$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/learning/docs {
      proxy_pass http://$upstream_learning_activity/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # community-path-service  (port 3015)
    # ================================================================

    location ^~ /api/v1/forums {
      auth_request /internal/auth;
      proxy_pass http://$upstream_community_path$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/paths {
      auth_request /internal/auth;
      proxy_pass http://$upstream_community_path$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/badges {
      auth_request /internal/auth;
      proxy_pass http://$upstream_community_path$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/forums/docs {
      proxy_pass http://$upstream_community_path/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ================================================================
    # orchestration-service  (port 3000)
    # Each controller path is routed explicitly.
    # ================================================================

    # Top-level /api/v1/orchestration catch-all (protected)
    location ^~ /api/v1/orchestration/ {
      auth_request /internal/auth;
      proxy_pass http://$upstream_orchestration$orchestration_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # /api/v1/workflows -> orchestration-service (canonical prefix per target mapping)
    location ^~ /api/v1/workflows {
      auth_request /internal/auth;
      proxy_pass http://$upstream_orchestration$api_v1_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Authorization     $http_authorization;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    # Webhooks externes : pas d'auth JWT utilisateur.
    # Protection assurée côté service par X-Webhook-Secret (WEBHOOK_SECRET).
    location ^~ /api/v1/orchestration/callbacks {
      proxy_pass http://$upstream_orchestration$orchestration_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Correlation-ID  $http_x_correlation_id;
    }

    location ^~ /api/v1/orchestration/docs {
      proxy_pass http://$upstream_orchestration/api/docs$docs_suffix;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # -- JSON error pages ------------------------------------------
    error_page 401 = @unauthorized;
    location @unauthorized {
      add_header Content-Type application/json always;
      return 401 '{"statusCode":401,"message":"Unauthorized"}';
    }

    error_page 403 = @forbidden;
    location @forbidden {
      add_header Content-Type application/json always;
      return 403 '{"statusCode":403,"message":"Forbidden"}';
    }

    # Si la gateway coupe malgre tout, elle le dit en JSON comme pour 401/403/502,
    # jamais en page HTML que le front ne sait pas lire.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
      add_header Content-Type application/json always;
      return 413 '{"statusCode":413,"message":"Payload Too Large"}';
    }

    error_page 502 503 504 = @unavailable;
    location @unavailable {
      add_header Content-Type application/json always;
      return 502 '{"statusCode":502,"message":"Service temporarily unavailable"}';
    }
  }
}
